name: Gerar APK do Ponto
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['kiosk-app/**', '.github/workflows/apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Aceitar licencas do Android SDK (o SDK ja vem no ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        working-directory: .
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: kiosk-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ponto-estrela-apk
          path: kiosk-app/android/app/build/outputs/apk/debug/app-debug.apk
