<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1a33" />
  <title>Celular Estrela</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0b1a33;color:#e8eefc;min-height:100vh;display:flex;justify-content:center}
    #app{width:100%;max-width:440px;padding:28px 20px}h1{font-size:22px;margin:0 0 4px}p{color:#9db0d6;font-size:14px;line-height:1.5}
    input{width:100%;padding:14px;margin:6px 0 12px;border-radius:12px;border:1px solid #2b4170;background:#12264a;color:#fff;font-size:16px}
    button{width:100%;padding:14px;border:0;border-radius:12px;background:#3b82f6;color:#fff;font-size:16px;font-weight:600;margin-top:6px}
    button.sec{background:#1c3361}.card{background:#12264a;border:1px solid #2b4170;border-radius:14px;padding:14px;margin:12px 0}
    .ok{color:#4ade80}.warn{color:#fbbf24}.err{color:#f87171}.row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
  </style>
</head>
<body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
